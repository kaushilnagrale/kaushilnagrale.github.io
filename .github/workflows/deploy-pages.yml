# Builds the Next.js site in v2/ as static files and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://kaushilnagrale.github.io
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages is still set to "Deploy from a branch", GitHub also publishes the old root index.html on every
      # push. Waiting for that run makes this deployment land last. Harmless once Source is "GitHub Actions".
      - name: Let the branch build finish first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            pending=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --json name,status \
              --jq '[.[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            [ "$pending" = "0" ] && break
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
